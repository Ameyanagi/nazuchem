name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, package and verify everything; skip registry uploads and GitHub Release
        type: boolean
        default: true

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  verify:
    name: Verify versions and publication gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      dry_run: ${{ steps.release.outputs.dry_run }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.12.10'
          python-version: '3.12'
      - name: Check every manifest against the tag
        id: release
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        shell: bash
        run: |
          args=()
          if [[ "$DRY_RUN" == true ]]; then args+=(--dry-run); fi
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then args+=(--tag "$GITHUB_REF_NAME"); fi
          uv run --no-project python scripts/check_release.py check "${args[@]}" --output "$GITHUB_OUTPUT"

  bindings:
    name: Build and verify release bindings
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/bindings.yml
    with:
      upload-artifacts: true

  crates:
    name: Build and package Rust libraries
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.12.10'
          python-version: '3.12'
      - name: Check formatting, lint and workspace tests
        shell: bash
        run: |
          export PYO3_PYTHON="$(uv python find 3.12)"
          libdir="$("$PYO3_PYTHON" -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')"
          export LD_LIBRARY_PATH="$libdir${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
      - name: Check provenance and notice collector
        run: |
          uv run --no-project python scripts/check_provenance.py
          uv run --no-project python -m unittest tests.test_check_provenance tests.test_binding_notices tests.test_release
      - name: Package first-release dependency graph in a scratch copy
        # Keeps owner gates in the checkout. Also runs in dry_run before gate removal.
        run: uv run --no-project python scripts/check_release.py package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rust-crates-preflight
          path: target/package/*.crate
          if-no-files-found: error

  distributions:
    name: Verify distributable metadata
    needs: [verify, bindings, crates]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: python-*
          path: dist
          merge-multiple: true
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.12.10'
          python-version: '3.12'
      - name: Validate wheel metadata for PyPI
        run: uvx --from twine twine check --strict dist/*.whl

  publish-crates:
    name: Publish crates.io (IR, kernel, n2s, s2n, facade)
    needs: [verify, distributions]
    if: needs.verify.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    env:
      USE_BOOTSTRAP: ${{ secrets.CRATES_IO_BOOTSTRAP_TOKEN != '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Obtain a short-lived crates.io token
        id: auth
        # crates.io cannot configure a trusted publisher before a crate exists.
        # Remove this environment secret after 0.1.0 and configure all five publishers.
        if: env.USE_BOOTSTRAP == 'false'
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_BOOTSTRAP_TOKEN || steps.auth.outputs.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        shell: bash
        run: |
          # Cargo waits for each uploaded version to appear in the index by default.
          # Check each exact version so a failed-job retry can resume partial publication.
          version="${RELEASE_TAG#v}"
          for crate in nazuchem-ir nazuchem-kernel nazuchem-n2s nazuchem-s2n nazuchem; do
            if curl -sf "https://index.crates.io/${crate:0:2}/${crate:2:2}/$crate" | grep -qF "\"vers\":\"$version\""; then
              echo "$crate $version is already published; skipping"
            else
              cargo publish -p "$crate" --locked
            fi
          done

  publish-pypi:
    name: Publish PyPI with attestations
    needs: [verify, distributions, publish-crates]
    if: needs.verify.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/nazuchem
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: python-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        # OIDC and attestations are the action defaults; no PyPI password/token.

  publish-npm:
    name: Publish npm with provenance
    needs: [verify, distributions, publish-crates]
    if: needs.verify.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/nazuchem
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-package
          path: npm-dist
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26.12.1'
          registry-url: https://registry.npmjs.org
      - name: Publish the exact tested Bun tarball
        # Bun 1.4.4 cannot generate provenance or use npm trusted publishing yet.
        # npm >=11.5.1 supports OIDC; Node 26 includes a suitable CLI.
        # npm also needs an existing package: use the environment secret ONLY for 0.1.0.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: npm publish npm-dist/nazuchem-package.tgz --access public --provenance --ignore-scripts

  github-release:
    name: Create GitHub Release
    needs: [verify, publish-crates, publish-pypi, publish-npm]
    if: needs.verify.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: python-*
          path: artifacts/python
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-package
          path: artifacts/npm
      - name: Release the tag with generated notes and all packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        shell: bash
        run: |
          mapfile -d '' files < <(find artifacts -type f -print0)
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes "${files[@]}"
