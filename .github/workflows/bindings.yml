name: Bindings

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      upload-artifacts:
        description: Upload the tested Python wheels and npm package
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  python:
    name: Python wheel (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.12.10'
          python-version: '3.12'
      - name: Install locked Python development tools
        run: uv sync --project bindings/python --locked --no-install-project
      - name: Test native Python error handling
        shell: bash
        # The test binary links libpython; put uv's interpreter libraries on the loader path.
        run: |
          libdir="$(uv run --project bindings/python --no-sync python -c 'import sys, sysconfig; print(sysconfig.get_config_var("LIBDIR") or sys.base_prefix)')"
          export LD_LIBRARY_PATH="$libdir${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export DYLD_LIBRARY_PATH="$libdir${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}"
          export PATH="$(uv run --project bindings/python --no-sync python -c 'import sys; print(sys.base_prefix)'):$PATH"
          uv run --project bindings/python --no-sync cargo test -p nazuchem-python --lib --locked
      - name: Build wheel and compare packaged licence bytes
        shell: bash
        # Preserve the existing wheel-only distribution scope; no source distribution is built.
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            uv run --project bindings/python --no-sync python bindings/python/scripts/build_wheel.py --release --zig --compatibility manylinux_2_28
          else
            uv run --project bindings/python --no-sync python bindings/python/scripts/build_wheel.py --release --compatibility pypi
          fi
      - name: Test the built wheel
        shell: bash
        run: uv run --no-project --python 3.12 --with bindings/python/dist/*.whl --with pytest --with jsonschema python -m pytest bindings/python/tests
      - name: Lint and type check Python
        working-directory: bindings/python
        run: |
          uv run --no-sync ruff check . ../../scripts/collect_binding_notices.py ../../tests/test_binding_notices.py
          uv run --no-sync ruff format --check . ../../scripts/collect_binding_notices.py ../../tests/test_binding_notices.py
          uv run --no-sync ty check
      - name: Type check shared notice collector
        run: uv run --project bindings/python --no-sync ty check scripts/collect_binding_notices.py tests/test_binding_notices.py
      - name: Upload tested Python wheels
        if: ${{ inputs.upload-artifacts }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-${{ matrix.os }}
          path: bindings/python/dist/*.whl
          if-no-files-found: error

  wasm:
    name: npm / WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain and wasm target
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain 1.99.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.12.10'
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26.12.1'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'
      - name: Install exact wasm-bindgen CLI
        run: |
          curl -fsSL -o "$RUNNER_TEMP/wasm-bindgen.tar.gz" https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.128/wasm-bindgen-0.2.128-x86_64-unknown-linux-musl.tar.gz
          printf '%s  %s\n' b51f0208fdff83515a787bd8ab9ac5865ed84dabb66d0c709957bb59793c645f "$RUNNER_TEMP/wasm-bindgen.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/wasm-bindgen.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/wasm-bindgen-0.2.128-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - name: Install pinned Binaryen (wasm-opt)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/binaryen.tar.gz" https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz
          printf '%s  %s\n' 2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489 "$RUNNER_TEMP/binaryen.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/binaryen.tar.gz" -C "$RUNNER_TEMP"
          echo "WASM_OPT=$RUNNER_TEMP/binaryen-version_133/bin/wasm-opt" >> "$GITHUB_ENV"
      - name: Install locked JavaScript development tools
        working-directory: bindings/wasm
        run: bun install --frozen-lockfile
      - name: Build bundler, web and node packages
        working-directory: bindings/wasm
        run: bun run build
      - name: Check declarations against the schema and test node build
        working-directory: bindings/wasm
        run: bun run test
      - name: Test the packed tarball and verify licence and notice bytes
        working-directory: bindings/wasm
        run: bun run check:package
      - name: Upload tested npm package
        if: ${{ inputs.upload-artifacts }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-package
          path: bindings/wasm/.generated/nazuchem-package.tgz
          include-hidden-files: true
          if-no-files-found: error

  notices:
    name: Notice collector regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.12.10'
          python-version: '3.12'
      - run: uv run --no-project python -m unittest tests.test_binding_notices
