[workspace]
members = [
    "bindings/python",
    "bindings/wasm",
    "crates/nazuchem",
    "crates/nazuchem-ir",
    "crates/nazuchem-kernel",
    "crates/nazuchem-n2s",
    "crates/nazuchem-s2n",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
repository = "https://github.com/Ameyanagi/nazuchem"
homepage = "https://github.com/Ameyanagi/nazuchem"
keywords = ["chemistry", "cheminformatics", "nomenclature", "iupac", "smiles"]
categories = ["science"]

[workspace.dependencies]
nazuchem-ir = { path = "crates/nazuchem-ir", version = "0.2.0" }
nazuchem-kernel = { path = "crates/nazuchem-kernel", version = "0.2.0" }
nazuchem-n2s = { path = "crates/nazuchem-n2s", version = "0.2.0" }
nazuchem-s2n = { path = "crates/nazuchem-s2n", version = "0.2.0" }
nazuchem = { path = "crates/nazuchem", version = "0.2.0" }

# Explicitly selected by the Wasm package builder; native/Python release is unchanged.
[profile.wasm-release]
inherits = "release"
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
