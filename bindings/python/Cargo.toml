[package]
name = "nazuchem-python"
version.workspace = true
edition.workspace = true
publish = false
# Private crates.io binding; the owner's distribution and provenance decisions gate release.
license = "(MIT OR Apache-2.0) AND MIT AND BSD-3-Clause AND BSD-2-Clause AND Python-2.0"
description = "Python bindings for Nazuchem chemical naming and structure IR"
readme = "README.md"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "_native"
crate-type = ["cdylib"]
doctest = false

[dependencies]
nazuchem = { workspace = true }
pyo3 = { version = "0.27.2", features = ["abi3-py310"] }
serde_json = "1"
