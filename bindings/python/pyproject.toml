[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "nazuchem"
version = "0.1.0"
description = "Chemical names, SMILES, and the lossless Nazuchem structure IR"
readme = "README.md"
requires-python = ">=3.10"
license = "(MIT OR Apache-2.0) AND MIT AND BSD-3-Clause AND BSD-2-Clause AND Python-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE", "NOTICE", "THIRD-PARTY-NOTICES.txt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "Typing :: Typed",
]

[dependency-groups]
dev = ["jsonschema>=4.23", "maturin>=1.8,<2", "pytest>=8.3", "ruff>=0.12", "ty>=0.0.1"]

[tool.maturin]
module-name = "nazuchem._native"
python-source = "python"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty.environment]
python-version = "3.10"
