[package]
name = "nazuchem-wasm"
version = "0.1.0"
edition = "2024"
publish = false
license = "(MIT OR Apache-2.0) AND MIT AND BSD-3-Clause AND BSD-2-Clause AND Python-2.0"
description = "Private WebAssembly bindings for nazuchem"
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nazuchem = { path = "../../crates/nazuchem" }
serde = "1"
serde_json = "1"
wasm-bindgen = "=0.2.128"
js-sys = "=0.3.105"
