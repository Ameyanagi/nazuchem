[package]
name = "nazuchem"
version.workspace = true
edition.workspace = true
publish = false
exclude = ["tests/"]
# Release gate: publication awaits the owner's release and provenance decisions.
# Established terms from the facade and its engines/kernel. The dependencies'
# Blue Book provenance remains pending; see NOTICE.
license = "(MIT OR Apache-2.0) AND MIT AND BSD-3-Clause AND BSD-2-Clause AND Python-2.0"
description = "Chemical naming with a Rust port of OPSIN and an extended openclatura 0.4.3 port"
readme = "README.md"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
documentation = "https://docs.rs/nazuchem"

[features]
default = ["n2s", "s2n"]
n2s = ["dep:nazuchem-n2s"]
s2n = ["dep:nazuchem-s2n"]

[dependencies]
nazuchem-ir = { workspace = true }
nazuchem-kernel = { workspace = true }
nazuchem-n2s = { workspace = true, optional = true }
nazuchem-s2n = { workspace = true, optional = true }

[dev-dependencies]
serde_json = "1"
