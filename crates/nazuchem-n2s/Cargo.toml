[package]
name = "nazuchem-n2s"
version.workspace = true
edition.workspace = true
license = "MIT"
description = "A native Rust port of OPSIN chemical name interpretation"
publish = false
exclude = ["tests/"]
# Release gate: publication awaits the owner's release and provenance decisions.
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
documentation = "https://docs.rs/nazuchem-n2s"
readme = "README.md"

[dependencies]
nazuchem-ir = { workspace = true }
nazuchem-kernel = { workspace = true }
roxmltree = "0.20"
regex = "1"

[dev-dependencies]
nazuchem-ir = { path = "../nazuchem-ir", features = ["test-support"] }
serde_json = "1"
sha2 = { version = "0.10.9", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
