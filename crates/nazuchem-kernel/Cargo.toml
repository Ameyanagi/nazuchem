[package]
name = "nazuchem-kernel"
version.workspace = true
edition.workspace = true
publish = false
# Established terms; native_order/{linux_sort,sort_common}.rs remain NOASSERTION
# pending the owner's sort-policy decision. This crate is not publishable yet.
license = "(MIT OR Apache-2.0) AND BSD-3-Clause AND BSD-2-Clause AND (Apache-2.0 WITH LLVM-exception)"
description = "Internal molecular perception kernel for nazuchem, adapted from RDKit and centres"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
documentation = "https://docs.rs/nazuchem-kernel"
readme = "README.md"

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
thiserror = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1"

[dev-dependencies]
anyhow = "1"
serde_json = { version = "1", features = ["float_roundtrip"] }
