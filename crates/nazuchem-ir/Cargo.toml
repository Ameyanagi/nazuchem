[package]
name = "nazuchem-ir"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "Shared naming vocabulary and versioned molecular structure IR for nazuchem"

[features]
schema = ["dep:schemars"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1.2.2", optional = true }
thiserror = "2"

[dev-dependencies]
schemars = "1.2.2"
