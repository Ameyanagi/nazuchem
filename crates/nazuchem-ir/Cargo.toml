[package]
name = "nazuchem-ir"
version.workspace = true
edition.workspace = true
publish = false
exclude = ["tests/"]
# Release gate: publication awaits the owner's release and provenance decisions.
license = "MIT OR Apache-2.0"
description = "Shared naming vocabulary and versioned molecular structure IR for nazuchem"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
documentation = "https://docs.rs/nazuchem-ir"

[features]
schema = ["dep:schemars"]
test-support = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1.2.2", optional = true }
thiserror = "2"

[dev-dependencies]
schemars = "1.2.2"
